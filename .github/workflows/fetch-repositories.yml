name: Refresh retro recommendations

on:
  schedule:
    # 03:17, 09:17, 15:17, 21:17 Asia/Shanghai (schedules can be delayed).
    - cron: "17 1,7,13,19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-retro-feed
  cancel-in-progress: false

jobs:
  refresh-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Check out RetroWhisper
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Test incremental feed updates
        run: python -m unittest discover -s tests -v

      - name: Collect up to ten new retro projects and retain history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_repositories.py

      - name: Commit refreshed feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/repositories.json
          git diff --cached --quiet || git commit -m "chore(data): refresh retro recommendations"
          git pull --rebase origin main
          git push origin HEAD:main
