<!doctype html>
<html lang="zh-CN" data-style="win98">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#008080" />
    <meta
      name="description"
      content="RetroWhisper：GitHub 上的复古游戏、模拟器与像素工具目录。"
    />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <title>RetroWhisper — 复古开源推荐墙</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-style="win98">
    <a class="skip-link" href="#discoveries">跳到推荐内容</a>
    <div class="page-noise" aria-hidden="true"></div>

    <div class="site-shell">
      <header class="site-header" aria-label="主导航">
        <a class="brand" href="#top" aria-label="RetroWhisper 首页">
          <span class="brand-mark" aria-hidden="true">RW</span>
          <span class="brand-copy">
            <strong>RETRO<span>/</span>WHISPER</strong>
            <small>GITHUB / RETRO PROJECTS</small>
          </span>
        </a>
        <nav class="main-nav">
          <a class="nav-link is-active" href="#discoveries">推荐墙</a>
          <a
            class="nav-link nav-github"
            href="https://github.com/lzq1206/RetroWhisper"
            target="_blank"
            rel="noreferrer"
          >
            <span aria-hidden="true">↗</span> GitHub
          </a>
        </nav>
      </header>

      <main id="top">

        <section class="discoveries-section" id="discoveries">
          <div class="section-heading">
            <div>
              <p class="eyebrow">PROJECT DIRECTORY</p>
              <h2>推荐项目<span class="heading-mark">/</span></h2>
            </div>
            <div class="sync-readout">
              <span class="sync-readout-label">更新于</span>
              <strong id="lastSync">—</strong>
            </div>
          </div>

          <div class="style-switcher surface" role="group" aria-label="切换界面风格">
            <span class="style-switcher-title">切换时代</span>
            <div class="style-options">
              <button class="style-option" type="button" data-style-option="pixel" aria-pressed="false">
                <span class="style-swatch swatch-pixel" aria-hidden="true"></span>
                <span><strong>像素终端</strong><small>1980s / ARCADE</small></span>
              </button>
              <button class="style-option is-selected" type="button" data-style-option="win98" aria-pressed="true">
                <span class="style-swatch swatch-win98" aria-hidden="true"></span>
                <span><strong>Win 98</strong><small>1990s / DESKTOP</small></span>
              </button>
              <button class="style-option" type="button" data-style-option="vista" aria-pressed="false">
                <span class="style-swatch swatch-vista" aria-hidden="true"></span>
                <span><strong>Vista 玻璃</strong><small>2000s / AERO</small></span>
              </button>
            </div>
          </div>

          <div class="feed-toolbar">
            <div class="filter-tabs" role="tablist" aria-label="项目类型">
              <button class="filter-tab is-active" type="button" data-filter="all" role="tab" aria-selected="true">全部 <span>10</span></button>
              <button class="filter-tab" type="button" data-filter="游戏" role="tab" aria-selected="false">游戏</button>
              <button class="filter-tab" type="button" data-filter="模拟器" role="tab" aria-selected="false">模拟器</button>
              <button class="filter-tab" type="button" data-filter="工具" role="tab" aria-selected="false">工具</button>
              <button class="filter-tab" type="button" data-filter="编辑器" role="tab" aria-selected="false">编辑器</button>
            </div>
            <div class="feed-controls">
              <label class="search-box" for="searchInput">
                <span aria-hidden="true">⌕</span>
                <input id="searchInput" type="search" placeholder="搜索项目、语言或标签" autocomplete="off" />
              </label>
              <label class="sort-control">
                <span>排序</span>
                <select id="sortSelect" aria-label="推荐排序">
                  <option value="curated">精选顺序</option>
                  <option value="stars">Star 热度</option>
                  <option value="updated">最近更新</option>
                </select>
              </label>
            </div>
          </div>

          <div class="feed-summary" aria-live="polite">
            <span id="resultSummary">正在加载项目...</span>
            <span class="summary-rule" aria-hidden="true"></span>
            <span class="summary-tip">打开 GitHub 仓库 ↗</span>
          </div>

          <div class="masonry-grid" id="feedGrid" aria-live="polite"></div>
          <div class="empty-state surface" id="emptyState" hidden>
            <span class="empty-icon" aria-hidden="true">∅</span>
            <h3>没有找到项目</h3>
            <p>换个关键词，或清空筛选。</p>
            <button class="button button-primary" type="button" id="resetFilters">清空筛选</button>
          </div>
        </section>
      </main>

      <footer class="site-footer">
        <span>RETRO/WHISPER © 2026</span>
        <span class="footer-center">GITHUB / RETRO PROJECTS</span>
        <a href="#top">回到顶部 ↑</a>
      </footer>
    </div>

    <script src="app.js" defer></script>
  </body>
</html>
